name: Datencheck

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Neue Zahlen suchen
        run: python3 scripts/daten_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
